# Single source of truth for model parameters. Edit here, not in code.
# Values marked ASSUMPTION are placeholders until the PA DOH contract terms are known
# (see docs/assumptions.md).

solver: gurobi            # gurobi | appsi_highs (needs the `fallback` extra)
seed: 867                 # RNG seed for Thompson sampling / simulation

geography:
  city: Pittsburgh
  state: PA
  tract_level: true       # census tracts, not ZIP codes (mitigates MAUP; Lee et al. 2018)

capacity:                 # status per parameter: SOURCED / PROXIED / ASSUMED (docs/assumptions.md)
  teams: 2                # ASSUMED; 1 adult supervisor + youth purchaser per team (job posting, press)
  hours_per_day: 8        # ASSUMED standard workday
  weekdays_only: true
  horizon_weeks: 13       # PROXIED: one quarter (decision card); a planning cycle may be shorter
  weekly_mileage_cap: 300 # ASSUMED and likely non-binding; prefer an OSM drive-time limit
  budget_inspections: 11  # PROXIED: City-limits undercover checks FY2022-25 average 44/yr (OCE national
                          # files) / 4 quarters. Statewide published checks are ~2,900/yr, not 10,000.
  service_minutes: 20     # ASSUMED, uniform until measured

prize:                    # r[i,d] = h_i * p_i + lambda * delta_deterrence_i(state_i)
  lambda_deterrence: 0.25
  h_weights:
    school_proximity: 0.4
    youth_density: 0.3
    historical_severity: 0.3
  school_buffer_m: 300

coverage:
  random_share: 0.20      # share of inspections reserved for baseline random sampling (m_S floor)
  min_per_tract: 1        # equity floor per tract with at least one retailer

harrington:               # ASSUMPTION: escalation states
  states: [low, high]
  escalate_after_violation: true

data:                     # source locations and vintages (see docs/data-sources.md)
  scope: city_limits      # city_limits (Pittsburgh city polygon, decided 2026-09-30) | postal
  state_fips: "42"
  county_fips: "003"      # Allegheny
  city_place_geoid: "4261000"   # Pittsburgh city (Census place), used for the city-limits flag
  pa_license_dataset: ut72-sft8 # data.pa.gov Tobacco Products Tax Licenses, refreshed daily
  tiger_year: 2023        # Census cartographic boundary vintage (tracts, places)
  nces_public_school_year: "2324"
  nces_private_school_year: "2122"
  acs_source: censusreporter    # censusreporter (keyless) | census_api (needs CENSUS_API_KEY)
  school_radii_m: [300, 1000]

paths:                    # always relative to the repository root
  raw: data/raw
  interim: data/interim
  processed: data/processed
  outputs: outputs
