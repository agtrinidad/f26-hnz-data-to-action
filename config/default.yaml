# Single source of truth for model parameters. Edit here, not in code.
# Values marked ASSUMPTION are placeholders until the PA DOH contract terms are known
# (see docs/assumptions.md).

solver: gurobi            # gurobi | appsi_highs (needs the `fallback` extra)
seed: 867                 # RNG seed for Thompson sampling / simulation

geography:
  city: Pittsburgh
  state: PA
  tract_level: true       # census tracts, not ZIP codes (mitigates MAUP; Lee et al. 2018)

capacity:                 # status per parameter: SOURCED / PROXIED / ASSUMED (docs/assumptions.md)
  teams: 2                # ASSUMED; 1 adult supervisor + youth purchaser per team (job posting, press)
  hours_per_day: 8        # ASSUMED standard workday
  weekdays_only: true
  horizon_weeks: 13       # PROXIED: one quarter (decision card); a planning cycle may be shorter
  weekly_mileage_cap: 300 # ASSUMED and likely non-binding; prefer an OSM drive-time limit
  budget_inspections: 11  # PROXIED: City-limits undercover checks FY2022-25 average 44/yr (OCE national
                          # files) / 4 quarters. Statewide published checks are ~2,900/yr, not 10,000.
  service_minutes: 20     # ASSUMED, uniform until measured
  cycle_weeks: 4          # monthly schedule (proposal); cycles per horizon = horizon_weeks // cycle_weeks

prize:                    # r[i,d] = h_i * p_i + lambda * delta_deterrence_i(state_i)
  lambda_deterrence: 0.25
  h_weights:
    school_proximity: 0.4
    youth_density: 0.3
    historical_severity: 0.3
  school_buffer_m: 300
  site_mix: {school: 0.7, youth_site: 0.3}   # weights inside the vulnerable-site proximity score

coverage:
  random_share: 0.20      # share of inspections reserved for baseline random sampling (m_S floor)
  min_per_tract: 0        # was 1. With ~96 in-city tracts and ~11 checks a quarter a per-tract floor is
                          # arithmetically infeasible; equity is audited instead (eval/equity.py)

harrington:               # state follows FDA's escalating penalty schedule (OIG Exhibit 3)
  state_weights: [0.25, 0.6, 0.8, 1.0, 1.0]   # ASSUMED weight by violations in last 36 months (0..4+)

risk:
  lag_days: 30            # decisions are not usable for scheduling until this long after the date
  kappa: 5                # Thompson prior strength (pseudo-checks) around p_i; chosen by simulation (assumed behavior)
  test_years: [2022, 2023, 2024, 2025]   # fiscal years for the time-split replay
  n_boot: 300
  population_rate_source: synar_allegheny # rescale mean p to the Synar Allegheny rate (26%)
  as_of: "2026-08-31"      # last decision date in the OCE files

solve:
  candidate_pool: 30      # top-M stores by sampled prize enter the routing model
  time_limit_s: 60
  depot: {lat: 40.4372, lon: -79.9972}   # ASSUMED: downtown Pittsburgh; replace with the team's base

census:                   # scenario: check every distinct retail location once in a year (memo 04)
  year: 2027
  onsite_minutes: 20      # ASSUMED (same as capacity.service_minutes)
  avg_mph: 22             # ASSUMED: converts drive minutes to miles for mileage reimbursement
  teams_options: [1, 2, 4, 8]
  admin_minutes: {low: 10, base: 15, high: 25}          # ASSUMED paperwork/evidence/data entry per check
  retry_share: {low: 0.05, base: 0.10, high: 0.20}      # ASSUMED share needing a second attempt (closed, refused)
  drive_factor: {low: 1.0, base: 1.5, high: 2.0}        # ASSUMED traffic/parking multiplier over OSM free-flow times
  supervisor_wage: {low: 28.0, base: 35.28, high: 45.0} # PROXIED: BLS OEWS Pittsburgh compliance officers mean $35.28/h
  purchaser_wage: {low: 15.0, base: 15.0, high: 20.0}   # SOURCED: contractor posting $15/h for under-21 purchasers
  fringe: {low: 1.25, base: 1.35, high: 1.5}            # ASSUMED benefits/payroll load multiplier
  mileage_rate: {low: 0.725, base: 0.76, high: 0.76}    # SOURCED: IRS 2026 business rate 72.5c (Jan-Jun), 76c (Jul-Dec)
  commute_miles_per_route: {low: 10, base: 25, high: 50} # ASSUMED team base to city and back
  overhead_share: {low: 0.15, base: 0.30, high: 0.50}   # ASSUMED indirect/fixed-fee share (cost-plus-fixed-fee contract)
  data_per_check: {low: 2.0, base: 5.0, high: 10.0}     # ASSUMED data handling and QA
  training_fixed: {low: 0, base: 2000, high: 5000}      # ASSUMED commissioning/background checks, one time
  topdown_per_check: {low: 116, high: 400}              # PROXIED: award / 10,000 funded; award / ~2,900 published
  followup_rate: {low: 0.58, base: 0.73, high: 0.88}    # SOURCED: share of violators re-inspected in 12 months (PA 58%, OIG 88%)
  award_dollars: 1159731  # SOURCED: latest annual DOH tobacco award (data-sources.md); only used for share-of-award context
  targeted_lift: 1.5      # SOURCED: observed top-decile replay lift (Gate A, ~1.47, interval 1.23-1.77); discounts the model's own p

regime:                   # two implementations of one regime: budget-capped vs census floor (memo 06, ADR 0007)
  observed_lift: 1.47     # SOURCED: Gate A pooled top-10% lift; sets how noisy the model's ranking is vs truth
  floor_months: 9         # ASSUMED: census floor (one check per store) is completed in months 1..floor_months
  second_pass_share: 0.25 # ASSUMED: need-weighted second pass = this share of N checks, in the remaining months

valuation:               # marginal value and what-ifs (memo 07, ADR 0008)
  pa_published_checks_per_year: 2900   # SOURCED: statewide published undercover checks per year (OCE files; data-sources.md)
  lambdas: [0.0, 0.25, 0.5]            # robustness rows for prize.lambda_deterrence (double-counting concern)
  whatif_day_hours: [4, 8]             # field-day lengths for the what-if sweep
  whatif_teams: [1, 2, 3, 4, 8]        # team counts for the what-if sweep

eval:
  lift_fracs: [0.1, 0.2]
  n_sims: 200

data:                     # source locations and vintages (see docs/data-sources.md)
  scope: city_limits      # city_limits (Pittsburgh city polygon, decided 2026-09-30) | postal
  state_fips: "42"
  county_fips: "003"      # Allegheny
  city_place_geoid: "4261000"   # Pittsburgh city (Census place), used for the city-limits flag
  pa_license_dataset: ut72-sft8 # data.pa.gov Tobacco Products Tax Licenses, refreshed daily
  tiger_year: 2023        # Census cartographic boundary vintage (tracts, places)
  nces_public_school_year: "2324"
  nces_private_school_year: "2122"
  acs_source: censusreporter    # censusreporter (keyless) | census_api (needs CENSUS_API_KEY)
  school_radii_m: [300, 1000]

viz:                      # report figures and dashboard (ADR 0009); styled after the class deck
  dpi: 300
  transparent: false      # PNG background; the dashboard has a checkbox and the CLI a --transparent flag
  figsize: [10.0, 5.6]    # 16:9-ish, matches slide content area
  font: [Open Sans, Segoe UI, DejaVu Sans]   # first installed family wins
  palette:
    ink: "#1A1A1A"        # headings, primary marks
    muted: "#6B6F76"      # subtitles, axes, secondary marks
    rule: "#D9DADD"       # gridlines and panel borders
    red: "#C41230"        # Heinz red, the one accent
    coral: "#E03C31"      # hero numbers
    blue: "#00548F"       # secondary series
  geo:
    eps_m: 400            # ASSUMED: DBSCAN neighbourhood radius (about a 5-minute walk)
    min_samples: 4        # ASSUMED: stores needed to call a cluster
    unobserved_flag: 0.5  # clusters with at least this share of never-checked stores are flagged
  top_n: 15
  columns:                # display names for builder fields (anything missing is auto-capitalized)
    p: Violation probability (p)
    h: Exposure (h)
    prize: Prize (r)
    deterrence: Follow-up term (Δ)
    fda_observed: Has FDA history
    fda_history: FDA history
    outlet_type: Outlet type
    trade_name: Store
    acs_poverty_rate: Tract poverty rate
    acs_youth_share: Tract youth share
    school_nearest_m: Distance to nearest school (m)
    school_within_1000m: Schools within 1 km
    n_prior_checks: Prior FDA checks
    n_prior_viol: Prior violations
    days_since_check: Days since last check
    prize_rank: Prize rank
    prize_sum: Summed prize
    prize_mean: Mean prize
    poverty_rate: Tract poverty rate
    youth_share: Tract youth share
    tract_geoid: Census tract
    found_per_cycle: Violations found per cycle
    distinct_violators: Distinct violators
    dollars_per_incremental_violator: Cost per added violator ($)
    violation: Violation (1 = yes)
    year: Year

paths:                    # always relative to the repository root
  raw: data/raw
  interim: data/interim
  processed: data/processed
  outputs: outputs
  figures: outputs/figures   # PNG exports (gitignored); final report PNGs go to docs/deliverable/figures
