[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tobacco-inspect"
version = "0.1.0"
description = "Budgeted prize-collecting routing for periodic tobacco-retail inspections in Pittsburgh, PA (CMU 94-867 project)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Abigail Torbatian", email = "atorbati@andrew.cmu.edu" },
  { name = "Avery Trinidad", email = "agtrinid@andrew.cmu.edu" },
  { name = "Anastasia Harouse", email = "aharouse@andrew.cmu.edu" },
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "requests>=2.32",
  "geopandas>=1.0",
  "shapely>=2.0",
  "osmnx>=2.0",
  "networkx>=3.3",
  "pyomo>=6.8",
  "gurobipy>=12.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# SHOULD tier: audit, communication, tests
should = ["statsmodels>=0.14", "matplotlib>=3.9", "folium>=0.17"]
# STRETCH tier: optional, currently unused by the pipeline (candidate for removal)
stretch = ["gymnasium>=1.0", "gurobi-machinelearning>=1.5"]
# Open-source solver fallback (set `solver: appsi_highs` in config)
fallback = ["highspy>=1.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "nbconvert>=7.17.1",
]

[project.scripts]
tobacco-inspect = "tobacco_inspect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tobacco_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# The notebook generator embeds long markdown/code strings
"scripts/build_notebook_02.py" = ["E501"]
"scripts/build_notebook_03.py" = ["E501"]
"scripts/build_notebook_04.py" = ["E501"]
